<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER HACK - Şifre Kırma Simülasyonu</title>
    <style>
        body {
            background-color: #08070b;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .arena-box {
            background: rgba(18, 16, 26, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4), inset 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
            margin-bottom: 5px;
            font-size: 26px;
            letter-spacing: 2px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 15px;
            font-weight: bold;
            color: #00ffcc;
        }
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .pad-btn {
            background-color: #1a1625;
            border: 2px solid #00ffcc;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            padding: 25px 0;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            transition: all 0.1s ease;
        }
        .pad-btn:active, .pad-btn.aktif {
            transform: scale(0.94);
            background-color: #ff007f;
            border-color: #fff;
            box-shadow: 0 0 20px #ff007f;
        }
        #status-msg {
            margin-top: 15px;
            font-size: 14px;
            min-height: 25px;
            color: #00ffcc;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }
        .btn-basla {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 12px 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-basla:hover {
            background: #00ffcc;
            color: #08070b;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="arena-box">
        <h1>CYBER HACK</h1>
        <p style="font-size: 12px; color: #888; margin-top: 0;">Güvenlik Duvarını Kaldır & Şifreyi Çöz</p>
        
        <div class="stats-bar">
            <span>BÖLÜM: <span id="stage-text" style="color: #ff007f;">1</span> / 3</span>
            <span>HATA: <span id="error-text">0</span>/3</span>
        </div>

        <!-- Hack Paneli (4 Renkli/Noktalı Siber Tuş) -->
        <div class="pad-grid" id="game-pad">
            <button class="pad-btn" onclick="oyuncuTikla(0)" data-index="0" style="border-color: #00ffcc;">1</button>
            <button class="pad-btn" onclick="oyuncuTikla(1)" data-index="1" style="border-color: #ff007f;">2</button>
            <button class="pad-btn" onclick="oyuncuTikla(2)" data-index="2" style="border-color: #9400d3;">3</button>
            <button class="pad-btn" onclick="oyuncuTikla(3)" data-index="3" style="border-color: #ffaa00;">4</button>
        </div>

        <div id="status-msg">Sistemi başlatmak için butona bas!</div>

        <button class="btn-basla" id="action-btn" onclick="oyunuBaslat()">SİSTEMİ HACKLE</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function sesCal(tur) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (tur === 'hata') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (tur === 'tik') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (tur === 'basari') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        let bolum = 1;
        let hatalar = 0;
        let hedefDizi = [];
        let oyuncuDizi = [];
        let oyunAktif = false;

        function oyunuBaslat() {
            hatalar = 0;
            bolum = 1;
            document.getElementById('error-text').textContent = hatalar;
            document.getElementById('stage-text').textContent = bolum;
            document.getElementById('action-btn').style.display = 'none';
            yeniBolumKur();
        }

        function yeniBolumKur() {
            oyuncuDizi = [];
            hedefDizi = [];
            oyunAktif = false;
            
            // Bölüme göre şifre uzunluğu (Bölüm 1: 3 adım, Bölüm 2: 4 adım, Bölüm 3: 5 adım)
            let uzunluk = bolum + 2;
            for (let i = 0; i < uzunluk; i++) {
                hedefDizi.push(Math.floor(Math.random() * 4));
            }

            document.getElementById('status-msg').textContent = `Bölüm ${bolum}: Şifre dizilimi yükleniyor... İzle!`;
            document.getElementById('status-msg').style.color = '#ffaa00';

            setTimeout(sifreyiGoster, 1000);
        }

        function sifreyiGoster() {
            let i = 0;
            let interval = setInterval(() => {
                if (i < hedefDizi.length) {
                    let butonIndex = hedefDizi[i];
                    tusIsiltiVer(butonIndex);
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        oyunAktif = true;
                        document.getElementById('status-msg').textContent = 'Sıra sende! Şifreyi aynı sırayla gir.';
                        document.getElementById('status-msg').style.color = '#00ffcc';
                    }, 500);
                }
            }, 800);
        }

        function tusIsiltiVer(index) {
            const tuslar = document.querySelectorAll('.pad-btn');
            const tus = tuslar[index];
            tus.classList.add('aktif');
            sesCal('tik');
            setTimeout(() => {
                tus.classList.remove('aktif');
            }, 400);
        }

        function oyuncuTikla(index) {
            if (!oyunAktif) return;

            tusIsiltiVer(index);
            oyuncuDizi.push(index);

            let mevcutAdim = oyuncuDizi.length - 1;

            // Yanlış tuşa basıldı mı kontrol et
            if (oyuncuDizi[mevcutAdim] !== hedefDizi[mevcutAdim]) {
                hatalar++;
                document.getElementById('error-text').textContent = hatalar;
                sesCal('hata');
                document.getElementById('status-msg').textContent = 'HATA! Yanlış kod bloğu!';
                document.getElementById('status-msg').style.color = '#ff007f';
                oyunAktif = false;

                if (hatalar >= 3) {
                    setTimeout(() => {
                        document.getElementById('status-msg').textContent = 'SİSTEM KİLİTLENDİ! (Oyun bitti)';
                        document.getElementById('action-btn').textContent = 'TEKRAR DENE';
                        document.getElementById('action-btn').style.display = 'inline-block';
                    }, 500);
                } else {
                    setTimeout(sifreyiGoster, 1200); // Aynı bölümü tekrar dene
                }
                return;
            }

            // Bölüm tamamlandı mı?
            if (oyuncuDizi.length === hedefDizi.length) {
                oyunAktif = false;
                sesCal('basari');
                
                if (bolum < 3) {
                    bolum++;
                    document.getElementById('stage-text').textContent = bolum;
                    document.getElementById('status-msg').textContent = `Bölüm ${bolum-1} Hacklendi! Sonraki aşamaya geçiliyor...`;
                    document.getElementById('status-msg').style.color = '#00ffcc';
                    setTimeout(yeniBolumKur, 1500);
                } else {
                    document.getElementById('status-msg').textContent = 'TEBRİKLER! TÜM GÜVENLİK DUVARLARI AŞILDI! 🚀';
                    document.getElementById('status-msg').style.color = '#00ffcc';
                    document.getElementById('action-btn').textContent = 'YENİDEN BAŞLAT';
                    document.getElementById('action-btn').style.display = 'inline-block';
                }
            }
        }
    </script>
</body>
</html>
