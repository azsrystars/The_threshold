<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE THRESHOLD - 1 in 8 Billion</title>
    <style>
        body {
            background-color: #08080c;
            color: #e0e0e6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        .container {
            background: rgba(15, 15, 22, 0.95);
            border: 1px solid #33334d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222233;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        h1 {
            color: #fff;
            margin: 0;
            font-size: 20px;
            letter-spacing: 2px;
        }
        .ecg-monitor {
            background: #000;
            border: 1px solid #ff3355;
            border-radius: 4px;
            width: 110px;
            height: 35px;
            position: relative;
            overflow: hidden;
        }
        #ecg-canvas {
            width: 100%;
            height: 100%;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 13px;
            color: #888899;
        }
        .stats span {
            color: #fff;
        }
        .game-track {
            position: relative;
            height: 280px;
            background: #0b0b12;
            border: 1px solid #222233;
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
        }
        #runner {
            position: absolute;
            left: 50px;
            bottom: 25px;
            font-size: 28px;
        }
        .obstacle {
            position: absolute;
            bottom: 25px;
            font-size: 24px;
        }
        .story-box {
            background: #0b0b12;
            border-left: 2px solid #ff3355;
            padding: 12px;
            margin: 15px 0;
            text-align: left;
            font-size: 12px;
            color: #cccccc;
            min-height: 85px;
            line-height: 1.4;
            max-height: 110px;
            overflow-y: auto;
        }
        .controls-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            background: transparent;
            border: 1px solid #555577;
            color: #fff;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            flex: 1;
        }
        .btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .btn-jump {
            border-color: #ff3355;
            color: #ff3355;
            background: rgba(255, 51, 85, 0.05);
        }
        .btn-jump:hover {
            background: #ff3355;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>THRESHOLD</h1>
            <div class="ecg-monitor" title="Canlı Yaşam Sinyali">
                <canvas id="ecg-canvas" width="110" height="35"></canvas>
            </div>
        </div>

        <div class="stats">
            <span>HAYATTA KALMA: <span id="score">0m</span></span>
            <span>KURBAN: <span id="victim-id" style="color: #ff3355;">#----</span></span>
        </div>

        <div class="game-track" id="track">
            <div id="runner">🧍</div>
            <div id="instruction" style="position: absolute; width:100%; top: 120px; color: #555; font-size: 11px; text-align: center;">Simülasyonu başlatmak için butona bas.</div>
        </div>

        <div class="story-box" id="story-display">
            Sistem telemetrisi aktif. Kurban verileri yüklenmeye hazır...
        </div>

        <div class="controls-area">
            <button class="btn btn-jump" id="jump-btn" onclick="zipla()" style="display:none;">Zıpla veya zıplama</button>
            <button class="btn" id="action-btn" onclick="oyunuBaslat()">SİMÜLASYONU BAŞLAT</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function sesCal(tur) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (tur === 'ziplama') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (tur === 'olum') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // 35 Adet Sarsıcı Gerçek Hayat Hikayesi
        const hikayelerHavuzu = [
            { id: "#4891", metin: "Kaan, 24 yaşında. Kredi kartı borçlarını ödeyebilmek için üç gündür uyumadan çalışıyordu. Dalgınlığına geldi, karşıdan gelen tramvayı görmedi bile. Geriye yarı içilmiş soğuk bir kahvesi kaldı." },
            { id: "#7210", metin: "Leyla, 31 yaşında. Mahalledeki sokak kedilerini beslemekten kendi kirasını unutan biriydi. 'Biri beni nasıl olsa görür' inancıyla yaşarken, en karanlık sokakta kimsesizler mezarlığına doğru yalnız yürüdü." },
            { id: "#1045", metin: "Mert, 19 yaşında. Babasının baskısından kaçmak için sabaha karşı evden kaçmıştı. Tek hayali sahil kenarında küçük bir plak dükkanı açmaktı. Hırsından gözü döndü ve ilk virajda duvara çakıldı." },
            { id: "#9322", metin: "Selin, 27 yaşında. Herkesin derdini dinleyen ama kendi acısını içine gömen o 'güçlü' arkadaş. İnsanlara yardım etmekten kendi hayatını kurmaya asla vakit bulamadı." },
            { id: "#3318", metin: "Emre, 35 yaşında. İnsanları dolandırarak elde ettiği parayla lüks içinde yaşarken, bir gece 'bana bir şey olmaz' kibriyle yolun ortasında durdu. Kimse arkasından ağlamadı; aksine dolandırılanlar rahat bir nefes aldı." },
            { id: "#6124", metin: "Deniz, 22 yaşında. Üniversite sınavını kazandığını öğrendiği gün kutlama yaparken, kurallara uymayan sarhoş bir sürücünün kurbanı oldu. Hayalleri bir saniyede karanlığa gömüldü." },
            { id: "#8859", metin: "Banu, 40 yaşında. Yıllarca ailesi için her şeyinden vazgeçti, kendi gençliğini feda etti. Tam kendisi için yaşayacağı sırada amansız bir hastalığa yakalandı." },
            { id: "#2041", metin: "Kerem, 28 yaşında. Sürekli başkalarının hayatına burun kıvrıp kusur arayan kibirli bir borsacıydı. Küçümsediği küçük bir risk tüm servetini ve hayatını ellerinden aldı." },
            { id: "#5519", metin: "Ayşe, 50 yaşında. Tek başına iki çocuğunu okutabilmek için elleri nasır tutana kadar gece gündüz temizliğe gitti. Otobüste yorgunluktan sızıp son durakta kalbine yenik düştü." },
            { id: "#1482", metin: "Burak, 21 yaşında. Sosyal medyada viral olmak için en tehlikeli uçurumlarda video çekiyordu. Beğeni sayılarını hayatından daha çok önemsediği o gün, son pozu oldu." },
            { id: "#7733", metin: "Zeynep, 33 yaşında. Yıllardır yazdığı ilk romanının basılacağını öğrendiği o muhteşem sabah, sevinçten geçirdiği ani kalp kriziyle hayata veda etti." },
            { id: "#9901", metin: "Can, 26 yaşında. Hız tutkunu bir motorcouydu. 'Azrail bile bana yetişemez' diyerek trafiğin altını üstüne getirirken, geride sadece paramparça bir kask bıraktı." },
            { id: "#3044", metin: "Elif, 25 yaşında. Hayvan hakları aktivistiydi. Barınaktaki yaralı bir köpeği kurtarmak için tipide dağ yoluna çıktı, bir daha asla geri dönmedi." },
            { id: "#6820", metin: "Onur, 38 yaşında. Şirkette yükselmek için en yakın dostlarını bile arkadan bıçaklayan hırslı bir müdürdü. En büyük terfisini aldığı gece masasında tek başına can verdi." },
            { id: "#4125", metin: "Gizem, 23 yaşında. Mimarlık fakültesi son sınıf öğrencisiydi. Proje teslim gecesi uykusuzluktan gözleri kapanırken merdivenlerden dengesini kaybedip düştü." },
            { id: "#1190", metin: "Tarık, 45 yaşında. Hayatı boyunca tatil yapmamış, emekli olup köyüne yerleşeceği günü hayal etmişti. Emekliliğine 2 hafta kala iş yerinde yığılıp kaldı." },
            { id: "#8392", metin: "Melis, 20 yaşında. Etrafındakilere hep 'ben çok güçlüyüm, kimseye ihtiyacım yok' maskesi taktı. İçindeki o devasa yalnızlık ruhunu yiyip bitirdi." },
            { id: "#5261", metin: "Volkan, 30 yaşında. Girdiği her iddiada ve kumarda hep kazanan o bencil adamdı. Kaderle iddiaya girdiği o son gecede her şeyi kaybetti." },
            { id: "#9411", metin: "Derya, 29 yaşında. Depresyondaki insanlara umut aşılayan popüler bir uzmandı. Kendi içindeki karanlığı o kadar kusursuz sakladı ki kimse onu kurtaramadı." },
            { id: "#2784", metin: "Serkan, 34 yaşında. Borç batağındayken tefecilerden kaçıyordu. Arkasına bakarak koşarken önündeki derin çukuru son anda bile fark edemedi." },
            { id: "#6650", metin: "Pelin, 24 yaşında. Modellik ajansından onay alabilmek için günlerce aç gezip sağlığını mahvetti. Bağışıklığı tamamen çöktüğünde artık çok geçiti." },
            { id: "#1833", metin: "Ozan, 27 yaşında. Sokak müzisyeniydi. Sokağın ortasında gitarını çalarken para vermeyen insanlarla kavga çıkardı, öfkesi boyunu aştı." },
            { id: "#7499", metin: "Nazlı, 32 yaşında. Evindeki her eşyanın kusursuz durmasını kafaya takmış takıntılı biriydi. En ufak bir leke yüzünden geçirdiği sinir krizi kalbini durdurdu." },
            { id: "#3921", metin: "Tolga, 22 yaşında. Arkadaşlarına hava atmak için babasının lüks arabasını kaçırdı. İlk keskin virajda aşırı hızın kurbanı oldu." },
            { id: "#5088", metin: "Yasemin, 41 yaşında. Hayatı boyunca risk almaktan korkmuş, hep kurallara göre yaşamıştı. Güvenli sandığı evinde yapayalnız sessizce öldü." },
            { id: "#1209", metin: "Kadir, 36 yaşında. Gece kulüplerinde eğlence peşinde koşan, sabahları ise hiçbir şey yokmuş gibi işe giden yorgun bir ruhtu. Aşırı doz kalbini durdurdu." },
            { id: "#8431", metin: "Nihan, 25 yaşında. İnternetten tanıştığı birine aşık olup ülkenin öbür ucuna kaçtı. Hayatının hatasını yaptığında çok geç kalmıştı." },
            { id: "#3302", metin: "Cem, 43 yaşında. Kumar masalarında malını mülkünü bitirmiş, son parasıyla da büyük bir vurgun yapmaya çalışırken ortada kaldı." },
            { id: "#9120", metin: "Büşra, 18 yaşında. Üniversiteyi kazandığı için dünyalar onun olmuştu ancak ilk şehir dışı yolculuğunda bindiği otobüs kaza yaptı." },
            { id: "#6541", metin: "Murat, 29 yaşında. Kendi garajında sabahlara kadar araba motoru modifiye ederken zehirli gazdan sızıp kaldı." },
            { id: "#4112", metin: "Sibel, 37 yaşında. Estetik ameliyat bağımlısıydı. 'Biraz daha küçük burun' derken masada kaldı, geride hırsının kurbanı bir ceset bıraktı." },
            { id: "#7890", metin: "Hakan, 31 yaşında. Dağcılık tutkusuydu. Arkadaşlarının 'hava kötü, gitme' uyarılarını dinlemedi, zirvede tipiye yakalandı." },
            { id: "#2345", metin: "Merve, 26 yaşında. Sürekli zayıflama çayları içip kendini aç bırakıyordu. Bir gün metroda ayakta giderken ansızın yere yığıldı." },
            { id: "#5678", metin: "Tarık, 39 yaşında. Mahallenin en cömert, en neşeli adamı bilinirdi ancak kendi içindeki derin depresyonu kimseye bir kez olsun sezdirmedi." },
            { id: "#9999", metin: "Gizemli bir yolcu. Kimliği tespit edilemedi. Üzerinden sadece tek yönlü tren bileti ve bir miktar bozuk para çıktı." }
        ];

        let oyunAktif = false;
        let skor = 0;
        let zipliyor = false;
        let runnerBottom = 25;
        let engelKonum = 480;
        let oyunDongusu;
        let aktifHikaye;
        let currentIndex = 0;

        // --- ECG / Nabız Çizim Mantığı ---
        const canvas = document.getElementById('ecg-canvas');
        const ctx = canvas.getContext('2d');
        let ecgOffset = 0;

        function cizNabiz(canliMi) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = canliMi ? '#ff3355' : '#444455';
            ctx.lineWidth = 2;
            ctx.beginPath();

            let yOrta = canvas.height / 2;
            for (let x = 0; x < canvas.width; x++) {
                let y = yOrta;
                if (canliMi) {
                    let dalgaKonumu = (x + ecgOffset) % 60;
                    if (dalgaKonumu > 20 && dalgaKonumu < 25) y -= 12;
                    else if (dalgaKonumu >= 25 && dalgaKonumu < 28) y += 14;
                    else if (dalgaKonumu >= 28 && dalgaKonumu < 31) y -= 6;
                }
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            if (canliMi) ecgOffset += 2;
        }

        setInterval(() => {
            cizNabiz(oyunAktif);
        }, 40);

        function siradakiHikayeyiSec() {
            let hikaye = hikayelerHavuzu[currentIndex];
            currentIndex = (currentIndex + 1) % hikayelerHavuzu.length;
            return hikaye;
        }

        function oyunuBaslat() {
            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('jump-btn').style.display = 'block';
            document.getElementById('instruction').style.display = 'none';
            
            skor = 0;
            aktifHikaye = siradakiHikayeyiSec();
            guncelleHikayeArayuzu();
            
            oyunAktif = true;
            engelKonum = 480;
            runnerBottom = 25;
            document.getElementById('runner').style.bottom = '25px';
            
            if (oyunDongusu) clearInterval(oyunDongusu);
            oyunDongusu = setInterval(anaDongu, 20);
        }

        function guncelleHikayeArayuzu() {
            document.getElementById('victim-id').textContent = aktifHikaye.id;
            document.getElementById('story-display').innerHTML = `<b>Kurban ${aktifHikaye.id}:</b> ${aktifHikaye.metin}`;
        }

        function zipla() {
            if (!oyunAktif || zipliyor) return;
            zipliyor = true;
            sesCal('ziplama');
            
            let yukselis = setInterval(() => {
                if (runnerBottom < 140) {
                    runnerBottom += 16;
                    document.getElementById('runner').style.bottom = runnerBottom + 'px';
                } else {
                    clearInterval(yukselis);
                    let dusus = setInterval(() => {
                        if (runnerBottom > 25) {
                            runnerBottom -= 16;
                            document.getElementById('runner').style.bottom = runnerBottom + 'px';
                        } else {
                            clearInterval(dusus);
                            runnerBottom = 25;
                            document.getElementById('runner').style.bottom = '25px';
                            zipliyor = false;
                        }
                    }, 12);
                }
            }, 12);
        }

        function anaDongu() {
            skor += 1;
            document.getElementById('score').textContent = skor + 'm';

            engelKonum -= 7;
            let engel = document.getElementById('obs');
            const trackElement = document.getElementById('track');
            
            if (!engel) {
                const yeniEngel = document.createElement('div');
                yeniEngel.id = 'obs';
                yeniEngel.className = 'obstacle';
                yeniEngel.style.right = '0px';
                yeniEngel.textContent = Math.random() > 0.4 ? '⚠️' : '💥';
                trackElement.appendChild(yeniEngel);
                engelKonum = 480;
            } else {
                engel.style.right = (480 - engelKonum) + 'px';
            }

            // DÜZELTİLDİ: Hitbox eşiği 55'ten 42'ye düşürüldü. 
            // Artık karakter zıpladığı an (42px ve üzerine çıktığı an) engelin üzerinden güvenle geçecek!
            if (engelKonum < 80 && engelKonum > 40 && runnerBottom < 42) {
                oldur();
            }

            if (engelKonum < -40) {
                if (engel) engel.remove();
            }
        }

        function oldur() {
            clearInterval(oyunDongusu);
            oyunAktif = false;
            sesCal('olum');

            const engel = document.getElementById('obs');
            if (engel) engel.remove();

            document.getElementById('jump-btn').style.display = 'none';
            document.getElementById('story-display').innerHTML = `<span style="color:#ff3355;">[SİSTEM ÇÖKTÜ - ÖLÜM]</span><br><b>${aktifHikaye.id} numaralı hayat son buldu. (${skor} metre)</b><br>${aktifHikaye.metin}`;
            document.getElementById('action-btn').textContent = 'BAŞKA BİR HAYATI HARCA';
            document.getElementById('action-btn').style.display = 'block';
        }
    </script>
</body>
</html>
